<!doctype html>
<!-- Source for og.png. Render at 1200x630 with: node site/tools/render-og.cjs (site served on :8765) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; }
  .txt { position: absolute; left: 80px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: block; width: 316px; height: 100px; image-rendering: pixelated; margin-bottom: 40px; }
  h1 { margin: 0; font-size: 52px; font-weight: 600; line-height: 1.1; letter-spacing: -0.03em; color: var(--text); }
  p { margin: 28px 0 0; font-size: 22px; color: var(--muted); }
  .grid { position: absolute; right: 72px; top: 75px; display: grid; grid-template-columns: repeat(3, 128px); gap: 32px; }
  .grid svg { display: block; width: 128px; height: 128px; }
</style></head>
<body>
<div class="txt"><img class="logo" src="../img/logo.svg" alt="Pixbits"><h1>Cute lil’ pixel icons, and a Skill to draw more.</h1><p>150 free 16×16 icons · pixbits.iamjahanvi.com</p></div>
<div class="grid" id="grid"></div>
<script type="module">
  import { svg } from "../js/core.js";
  const lib = await fetch("../data/icons.json").then((r) => r.json());
  document.getElementById("grid").innerHTML = ["cherry", "frog", "rocket", "cat", "heart", "whale", "mushroom", "sunflower", "hot-air-balloon"]
    .map((s) => svg({ ...lib.find((i) => i.slug === s).color }, 128)).join("");
  await document.fonts.ready;
  document.body.dataset.ready = "1";
</script></body></html>
