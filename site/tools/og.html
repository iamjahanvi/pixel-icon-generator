<!doctype html>
<!-- Source for og.png. Render at 1200x630 with: node site/tools/render-og.cjs (site served on :8765) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; }
  .og { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .og .logo { display: block; width: 380px; height: 120px; image-rendering: pixelated; margin: 0 0 34px; }
  .og h1 { font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 20px; }
  .og p { font-size: 24px; color: var(--muted); margin: 0; }
  .ic { position: absolute; image-rendering: pixelated; }
  .ic svg { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
</style></head>
<body>
<div id="ics"></div>
<div class="og"><img class="logo" src="../img/logo.svg" alt="Pixbits" width="380" height="120"><h1>Type a word.<br>Get a pixel icon.</h1><p>150 free 16×16 icons, and a skill for your AI &middot; pixbits.iamjahanvi.com</p></div>
<script type="module">
  import { svg } from "../js/core.js";
  const lib = await fetch("../data/icons.json").then((r) => r.json());
  const at = [["cherry", 80, 60, 88], ["cat", 56, 270, 96], ["watermelon", 150, 470, 88], ["frog", 250, 70, 80],
              ["rocket", 1050, 60, 88], ["heart", 1076, 280, 88], ["whale", 990, 470, 96], ["medal-gold", 900, 70, 80],
              ["mushroom", 300, 500, 72], ["hot-air-balloon", 850, 500, 72]];
  document.getElementById("ics").innerHTML = at.map(([s, x, y, z]) => {
    const ic = lib.find((i) => i.slug === s);
    return `<div class="ic" style="left:${x}px;top:${y}px;width:${z}px;height:${z}px">${svg({ ...ic.color }, z)}</div>`;
  }).join("");
  await document.fonts.ready;
  document.body.dataset.ready = "1";
</script></body></html>
