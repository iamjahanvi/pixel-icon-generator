<!doctype html>
<!-- Source for og.png. Render at 1200x630: node site/tools/render-og.cjs -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { display: grid; grid-template-columns: 1fr 560px; gap: 40px; align-items: center; height: 630px; padding: 0 64px; box-sizing: border-box; }
  .og h1 { font-size: 92px; line-height: 0.98; margin: 0 0 28px; }
  .og p { font-size: 30px; line-height: 1.3; margin: 0 0 30px; max-width: 15em; }
  .og .url { font-weight: 700; font-size: 24px; }
  .pairs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 28px; }
  .pair { display: flex; flex-direction: column; gap: 10px; background: #fff; box-shadow: var(--px); margin: 2px; padding: 14px; align-items: center; }
  .pair svg { width: 96px; height: 96px; image-rendering: pixelated; }
</style></head>
<body><div class="og">
  <div><h1>Pixel Icons</h1><p>Type a word. Get a 16×16 icon in colour and in black &amp; white.</p><div class="url">pixelicons.iamjahanvi.com</div></div>
  <div class="pairs" id="pairs"></div>
</div>
<script type="module">
  import { svg } from "../js/core.js";
  const lib = await fetch("../data/icons.json").then((r) => r.json());
  const pick = ["cherry", "lantern", "cat", "rocket", "mushroom", "tulip"].map((s) => lib.find((i) => i.slug === s));
  const top = pick.slice(0, 3), row = (ic) => `<div class="pair">${svg({ ...ic.color }, 96)}${svg({ ...ic.bw }, 96)}</div>`;
  document.getElementById("pairs").innerHTML = top.map(row).join("");
  document.body.dataset.ready = "1";
</script></body></html>
